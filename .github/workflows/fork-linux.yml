name: Fork Linux binary

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  build:
    if: github.repository == 'tkmsgr/herdr'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8
        with:
          toolchain: 1.96.1
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29
        with:
          version: 0.15.2
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
        with:
          key: fork-linux-release
      - name: Build patched binary
        env:
          HERDR_BUILD_COMMIT: ${{ github.event.pull_request.head.sha }}
        run: cargo build --release --locked
      - name: Exercise prefix input through a real client and server
        run: python3 scripts/fcitx_prefix_smoke.py target/release/herdr
      - name: Record build identity
        env:
          BUILD_COMMIT: ${{ github.event.pull_request.head.sha }}
        run: |
          cp target/release/herdr herdr-linux-x86_64
          printf '%s\n' "$BUILD_COMMIT" > BUILD_COMMIT
          sha256sum herdr-linux-x86_64 > SHA256SUMS
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: herdr-linux-x86_64-${{ github.event.pull_request.head.sha }}
          path: |
            herdr-linux-x86_64
            BUILD_COMMIT
            SHA256SUMS
          retention-days: 30
